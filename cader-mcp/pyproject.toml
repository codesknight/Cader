[project]
name = "cader-mcp"
version = "0.1.0"
description = "CAD agent harness research and reproducible MCP smoke tooling"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp==1.28.1", "pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cader-mcp = "cader_mcp.cli:main"

[project.optional-dependencies]
vision = [
    "onnxruntime>=1.32.0",
    "rapidocr>=3.10.0",
    "scikit-image>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cader_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
