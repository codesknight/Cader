version: 1
id: SubAgent
role: subagent
description: Analyze one bounded independent text task and return findings and uncertainty.
when_to_use: Independent read-only analysis; no CAD writes, delegation or final task acceptance.
provider: openai-compatible
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY
model: deepseek-v4-pro
input: [text]
generation:
  max_output_tokens: 2048
  reasoning_effort: off
timeout_ms: 120000
can_delegate: false
