version: 1
id: VisionAgent
role: vision
description: Review actual image evidence and return a schema-validated visual report.
when_to_use: Drawing appearance, symbols, labels, layout or source-image fidelity; use the controlled CAD review entry.
provider: openai-compatible
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY
# The official capability table lists Flash as vision-capable; Pro is text-only.
model: deepseek-flash
input: [text, image]
generation:
  max_output_tokens: 8192
  reasoning_effort: off
timeout_ms: 120000
can_delegate: false
