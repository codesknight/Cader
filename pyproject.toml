[project]
name = "cader"
version = "0.1.0"
description = "CAD agent harness research and reproducible MCP smoke tooling"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp==1.28.1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
deepagents = ["deepagents==0.7.39"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cader = "cader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/designs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
